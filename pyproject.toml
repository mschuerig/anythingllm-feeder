[project]
name = "anythingllm-feeder"
version = "0.1.6"
description = "Extract documents and videos to Markdown (forage) and upload them into a local AnythingLLM (ingest)"
requires-python = ">=3.11"
authors = [{ name = "Michael Schuerig", email = "michael@schuerig.de" }]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27", "send2trash>=1.8", "shtab>=1.7"]

[project.optional-dependencies]
docling = ["docling"]
whisper = ["mlx-whisper"]
all = ["docling", "mlx-whisper"]
dev = ["pytest", "argparse-manpage>=4.5"]

[project.scripts]
forage = "forage.cli:main"
ingest = "ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/_shared", "src/forage", "src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
