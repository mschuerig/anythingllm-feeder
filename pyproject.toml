[project]
name = "anythingllm-feeder"
version = "0.1.0"
description = "Extract documents and videos to Markdown (forage) and upload them into a local AnythingLLM (ingest)"
requires-python = ">=3.11"
authors = [{ name = "Michael Schuerig", email = "michael@schuerig.de" }]
readme = "README.md"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
docling = ["docling"]
whisper = ["mlx-whisper"]
all = ["docling", "mlx-whisper"]
dev = ["pytest"]

[project.scripts]
forage = "forage.cli:main"
ingest = "ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/_shared", "src/forage", "src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
