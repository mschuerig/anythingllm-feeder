[project]
name = "forage"
version = "0.1.0"
description = "Extract documents and videos to Markdown for local LLM use"
requires-python = ">=3.11"
authors = [{ name = "Michael Schuerig", email = "michael@schuerig.de" }]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
docling = ["docling"]
whisper = ["mlx-whisper"]
all = ["docling", "mlx-whisper"]
dev = ["pytest"]

[project.scripts]
forage = "forage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
